[project]
name = "meumonitorai-document-parser-spike"
version = "0.1.0"
description = "Isolated Docling parsing spike for MeuMonitorAI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.122.0",
  "pypdfium2==5.10.1",
  "transformers==4.57.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
