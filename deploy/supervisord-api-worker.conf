[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord-api-worker.pid
loglevel=info

[program:api]
command=node /app/backend/dist/server.js
directory=/app/backend
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=node /app/backend/dist/worker.js
directory=/app/backend
priority=20
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
